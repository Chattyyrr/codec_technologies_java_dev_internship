<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Your cart</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container narrow"><p class="eyebrow">YOUR SELECTION</p><h1>Shopping cart</h1><p th:if="${error}" class="error" th:text="${error}"></p><p th:if="${lines.isEmpty()}" class="empty">Your cart is empty. <a th:href="@{/}">Browse books</a>.</p><div th:each="line : ${lines}" class="cart-line"><div><b th:text="${line.book.title}"></b><p th:text="${line.book.author}"></p></div><form th:action="@{/cart/update}" method="post"><input type="hidden" name="bookId" th:value="${line.book.id}"><input type="number" name="quantity" min="0" th:value="${line.quantity}"><button class="secondary">Update</button></form><b th:text="'₹' + ${line.lineTotal}"></b></div><div class="total" th:if="${!lines.isEmpty()}"><span>Total</span><strong th:text="'₹' + ${total}"></strong></div><form th:if="${!lines.isEmpty()}" method="post" th:action="@{/checkout}"><button class="wide">Proceed to checkout</button></form><p class="muted small">Enter quantity 0 to remove an item.</p></main></body></html>
