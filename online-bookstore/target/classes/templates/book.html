<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Book details</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container detail"><div class="cover big"><span>BOOKNEST</span><strong th:text="${book.title}"></strong><small th:text="${book.author}"></small></div><section><p class="eyebrow" th:text="${book.category} ?: 'FEATURED BOOK'"></p><h1 th:text="${book.title}"></h1><h3 class="muted" th:text="'by ' + ${book.author}"></h3><p th:text="${book.description}"></p><h2 th:text="'₹' + ${book.price}"></h2><p th:text="'In stock: ' + ${book.stock}"></p><form th:action="@{/cart/add/{id}(id=${book.id})}" method="post" class="buy"><input type="number" name="quantity" min="1" value="1"><button th:disabled="${book.stock == 0}">Add to cart</button></form></section></main></body></html>
