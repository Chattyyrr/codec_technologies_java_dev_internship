<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Login</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="auth"><p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1><p th:if="${param.error}" class="error">Invalid email or password.</p><p th:if="${param.registered}" class="success">Account created. Please sign in.</p><form method="post" th:action="@{/login}"><label>Email<input type="email" name="username" required></label><label>Password<input type="password" name="password" required></label><button class="wide">Sign in</button></form><p>New here? <a th:href="@{/register}">Create an account</a></p></main></body></html>
