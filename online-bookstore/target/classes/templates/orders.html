<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>My orders</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container narrow"><p class="eyebrow">YOUR PURCHASES</p><h1>Order history</h1><p th:if="${param.paid}" class="success">Demo payment marked as successful.</p><article class="order" th:each="order : ${orders}"><div class="row-between"><b th:text="'Order #' + ${order.id}"></b><span class="status" th:text="${order.paymentStatus}"></span></div><p th:text="${#temporals.format(order.createdAt,'dd MMM yyyy, HH:mm')}"></p><p th:each="item : ${order.items}" th:text="${item.book.title} + ' × ' + ${item.quantity}"></p><strong th:text="'Total: ₹' + ${order.total}"></strong></article><p th:if="${orders.isEmpty()}" class="empty">No orders yet.</p></main></body></html>
