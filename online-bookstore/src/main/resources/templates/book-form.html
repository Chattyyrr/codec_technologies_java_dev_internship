<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Add book</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="auth"><h1>Add a book</h1><form method="post" th:action="@{/admin/books}" th:object="${book}"><label>Title<input th:field="*{title}" required></label><label>Author<input th:field="*{author}" required></label><label>Category<input th:field="*{category}"></label><label>Description<textarea th:field="*{description}"></textarea></label><label>Price (INR)<input type="number" step="0.01" min="0.01" th:field="*{price}" required></label><label>Stock<input type="number" min="0" th:field="*{stock}" required></label><button class="wide">Save book</button></form></main></body></html>
