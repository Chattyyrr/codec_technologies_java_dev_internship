<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Create account</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="auth"><p class="eyebrow">JOIN BOOKNEST</p><h1>Create account</h1><p th:if="${error}" class="error" th:text="${error}"></p><form method="post" th:action="@{/register}"><label>Full name<input name="name" th:value="${name}" required></label><label>Email<input type="email" name="email" th:value="${email}" required></label><label>Password<input type="password" name="password" minlength="8" required></label><button class="wide">Create account</button></form><p>Already registered? <a th:href="@{/login}">Sign in</a></p></main></body></html>
