<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Manage books</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container"><div class="section-head"><h1>Manage books</h1><a class="button-link" th:href="@{/admin/books/new}">Add a book</a></div><div class="table-wrap"><table><tr><th>Title</th><th>Author</th><th>Price</th><th>Stock</th><th></th></tr><tr th:each="book : ${books}"><td th:text="${book.title}"></td><td th:text="${book.author}"></td><td th:text="${book.price}"></td><td th:text="${book.stock}"></td><td><form th:action="@{/admin/books/{id}/delete(id=${book.id})}" method="post"><button class="danger">Delete</button></form></td></tr></table></div></main></body></html>
