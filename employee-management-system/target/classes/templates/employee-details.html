<!doctype html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><title>Employee profile</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container narrow"><a class="back" th:href="@{/employees}">← Back to directory</a><section class="profile-card"><div class="profile-top"><span class="avatar large" th:text="${#strings.substring(employee.firstName,0,1) + #strings.substring(employee.lastName,0,1)}"></span><div><p class="eyebrow" th:text="${employee.employeeCode}"></p><h1 th:text="${employee.fullName}"></h1><p class="muted" th:text="${employee.designation} + ' · ' + ${employee.department}"></p></div><span class="status active" th:text="${employee.status}"></span></div><div class="details-grid"><div><small>EMAIL ADDRESS</small><b th:text="${employee.email}"></b></div><div><small>PHONE NUMBER</small><b th:text="${employee.phone}"></b></div><div><small>DEPARTMENT</small><b th:text="${employee.department}"></b></div><div><small>DESIGNATION</small><b th:text="${employee.designation}"></b></div><div><small>DATE OF JOINING</small><b th:text="${employee.dateOfJoining}"></b></div><div><small>ANNUAL SALARY</small><b th:text="'₹' + ${#numbers.formatDecimal(employee.salary,1,2)}"></b></div></div><div class="profile-actions"><a class="primary button-link" sec:authorize="hasAnyRole('ADMIN','HR')" th:href="@{/employees/{id}/edit(id=${employee.id})}">Edit record</a><a class="secondary button-link" th:href="@{/employees}">Return to directory</a></div></section></main></body></html>
