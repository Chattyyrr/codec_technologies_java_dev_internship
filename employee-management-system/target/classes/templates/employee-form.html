<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title th:text="${pageTitle} + ' | PeopleDesk'"></title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container form-container"><a class="back" th:href="@{/employees}">← Back to directory</a><p class="eyebrow">EMPLOYEE INFORMATION</p><h1 th:text="${pageTitle}"></h1><p class="muted">Enter accurate details in the fields below.</p><p th:if="${formError}" class="error" th:text="${formError}"></p><form th:action="@{/employees/save}" th:object="${employee}" method="post" class="form-card"><input type="hidden" th:field="*{id}"><div class="form-grid">
<label>Employee ID<input th:field="*{employeeCode}" placeholder="e.g. EMP-1001" required><small th:errors="*{employeeCode}" class="error"></small></label>
<label>First name<input th:field="*{firstName}" required><small th:errors="*{firstName}" class="error"></small></label>
<label>Last name<input th:field="*{lastName}" required><small th:errors="*{lastName}" class="error"></small></label>
<label>Email address<input type="email" th:field="*{email}" required><small th:errors="*{email}" class="error"></small></label>
<label>Phone number<input th:field="*{phone}" required></label>
<label>Department<input th:field="*{department}" placeholder="e.g. Engineering" required></label>
<label>Designation<input th:field="*{designation}" placeholder="e.g. Software Engineer" required></label>
<label>Annual salary (INR)<input type="number" min="0" step="0.01" th:field="*{salary}" required><small th:errors="*{salary}" class="error"></small></label>
<label>Date of joining<input type="date" th:field="*{dateOfJoining}" required><small th:errors="*{dateOfJoining}" class="error"></small></label>
<label>Employment status<select th:field="*{status}"><option th:each="s : ${T(com.internship.ems.model.EmploymentStatus).values()}" th:value="${s}" th:text="${s}"></option></select></label>
</div><div class="form-actions"><a class="secondary button-link" th:href="@{/employees}">Cancel</a><button class="primary">Save employee</button></div></form></main></body></html>
