<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>PeopleDesk | Sign in</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="login-page"><main class="login-card"><div class="mark">PD</div><p class="eyebrow">PEOPLEDESK · WORKFORCE PORTAL</p><h1>Welcome back.</h1><p class="muted">Sign in to manage your team's records.</p><p th:if="${param.error}" class="error">Incorrect username or password.</p><p th:if="${param.logout}" class="success">You have been signed out.</p><form method="post" th:action="@{/login}"><label>Username<input name="username" required autofocus></label><label>Password<input type="password" name="password" required></label><button class="primary wide">Sign in</button></form><small>Demo accounts are listed in the project README.</small></main></body></html>
